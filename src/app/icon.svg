<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scelBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113F33" />
      <stop offset="100%" stop-color="#071B16" />
    </linearGradient>

    <linearGradient id="scelTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" />
      <stop offset="100%" stop-color="#16A085" />
    </linearGradient>

    <linearGradient id="scelGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#D4AC0D" />
    </linearGradient>

    <filter id="scelSoftGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- badge background -->
  <rect x="16" y="16" width="480" height="480" rx="105" ry="105" fill="url(#scelBgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="103" ry="103" fill="none" stroke="#2ECC71" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- rotation ring connecting the members -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#scelTealGrad)" stroke-width="3" stroke-dasharray="9 11" opacity="0.55" />

  <!-- six members taking turns around the circle; the gold one is receiving this cycle's payout -->
  <circle cx="399" cy="173.5" r="19" fill="url(#scelTealGrad)" stroke="#071B16" stroke-width="3" />
  <circle cx="399" cy="338.5" r="19" fill="url(#scelTealGrad)" stroke="#071B16" stroke-width="3" />
  <circle cx="256" cy="421" r="19" fill="url(#scelTealGrad)" stroke="#071B16" stroke-width="3" />
  <circle cx="113" cy="338.5" r="19" fill="url(#scelTealGrad)" stroke="#071B16" stroke-width="3" />
  <circle cx="113" cy="173.5" r="19" fill="url(#scelTealGrad)" stroke="#071B16" stroke-width="3" />

  <g filter="url(#scelSoftGlow)">
    <circle cx="256" cy="91" r="23" fill="url(#scelGoldGrad)" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- small arrow hinting the turn passes to the next member -->
  <path d="M 320,110 A 165,165 0 0 1 372,152" fill="none" stroke="url(#scelGoldGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 364,138 L 378,155 L 359,161" fill="none" stroke="url(#scelGoldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- pooled savings, front and center -->
  <circle cx="256" cy="256" r="46" fill="url(#scelGoldGrad)" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="256" cy="256" r="36" fill="none" stroke="#D4AC0D" stroke-width="1.5" />
  <text x="256" y="272" font-family="Arial, sans-serif" font-weight="bold" font-size="38" fill="#604800" text-anchor="middle">$</text>
</svg>
